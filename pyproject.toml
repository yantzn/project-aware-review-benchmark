[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-aware-review-benchmark"
version = "0.1.0"
description = "Benchmark fixtures for project-aware AI code review."
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
